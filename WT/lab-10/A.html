<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Quary</title>
    <style>
        .box1{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: blue;
        }

        .box2{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: aqua;
        }

        .box3{
            height: 100px;
            width: 100px;
            border: 2px solid black;
            background-color: yellow;
        }


        @media (max-width : 600px){
            .box1{
                height: 200px;
                width: 200px;
                border: 8px dotted black;
                background-color: brown;
                border-radius: 50%;
            }
        }

        @media (max-width : 1024px) and (min-width : 601px){
            .box2{
                height: 300px;
                width: 300px;
                border: 10px solid slategray;
                background-color: darkblue;
                border-radius: 50%;
            }
        }

        @media (min-width : 1025px){
            .box3{
                height: 400px;
                width: 400px;
                border: 4px solid chartreuse;
                background-color: khaki;
                border-radius: 50%;
            }
        }

    </style>
</head>
<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>require attribute</title>
</head>
<body>
    <form>

        <h1>Contact Detail</h1>

        <table>

        <tr>
            <td>FullName</td>
            <td>
                <input type="text" name="fullname" pattern="[A-Za-z ]{3,50}" required>
            </td>
        </tr>

        <tr>
            <td>Email</td>
            <td>
                <input type="email" name="email" required>
            </td>
        </tr>

        <tr>
            <td>Mobile No</td>
            <td>
                <input type="tel" name="mobile" pattern="[0-9]{10}" required>
            </td>
        </tr>

        <tr>
            <td>Address</td>
            <td>
                <textarea name="address" rows="6" cols="25" required></textarea>
            </td>
        </tr>

    </table>
    </form>
</body>
</html>

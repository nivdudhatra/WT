<body>
    <header>
        <h1>Welcome to My Website</h1>

    <nav>
        <ul>
            <li><a href="1.html">Home</a></li>
            <!-- <li><a href="#about">About</a></li>
            <li><a href="#services">Services</a></li> -->
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <form>

        <h1>Contact Detail</h1>

        <table>

        <tr>
            <td>FullName</td>
            <td>
                <input type="text" name="fullname" pattern="[A-Za-z ]{3,50}" required>
            </td>
        </tr>

        <tr>
            <td>Email</td>
            <td>
                <input type="email" name="email" required>
            </td>
        </tr>

        <tr>
            <td>Mobile No</td>
            <td>
                <input type="tel" name="mobile" pattern="[0-9]{10}" required>
            </td>
        </tr>

        <tr>
            <td>Address</td>
            <td>
                <textarea name="address" rows="6" cols="25" required></textarea>
            </td>
        </tr>

    </table>
    </form>

</body>
</html>

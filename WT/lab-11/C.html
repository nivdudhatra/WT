<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Combined Pseudo-Class and Element</title>
    <style>
        
        p::first-letter { 
            font-size: 25px;
            color: green; 
            font-weight: bold;
        }
       
        p:hover::first-letter {
            font-size: 40px;
            color: red; 
            font-weight: bold;
        }
    </style>
</head>
<body>
    <p>Hover your mouse over this paragraph to watch only the very first letter change its color dynamically!</p>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pseudo-Elements Example</title>
    <style>
        
       
        p::first-letter {
             font-size: 50px; 
             font-weight: bold;
             color: #d9534f; 
        }
        
        
        p::first-line { 
            color: #0275d8; 
            font-weight: bold; 
        }
        
        
        ::selection { 
            background-color: #ffeb3b; 
            color: #000; 
        }
    </style>
</head>
<body>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.
         Labore aliquam vitae illo est assumenda distinctio eligendi rem officiis quas. 
        Eligendi aperiam facilis voluptas optio mollitia, amet eum nesciunt dicta nostrum?</p>
</body>
</html>

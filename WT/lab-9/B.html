<!DOCTYPE html>
<html>
<head>
    <title>CSS Effects</title>

    <style>
       
        a:link {
            color: orange;
        }

        a:visited {
            color: red;
        }

        
        p::first-line {
            color: blue;
            font-size: 20px;
            font-weight: bold;
        }

       
        p::first-letter {
            color: green;
            font-size: 40px;
            font-weight: bold;
        }

        
        ::selection {
            background-color: yellow;
            color: black;
        }

      
        h2:hover {
            color: red;
            font-size: 30px;
            background-color: blue;
        }
    </style>
</head>

<body>
   
    <p>
        <a href="A.html">Visit</a>
    </p>

    
    <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. 
        Nostrum adipisci nam similique tenetur deserunt veniam corrupti, 
        nulla incidunt voluptatibus quae alias eaque optio, eius fugit neque? Praesentium debitis maiores 
    </p>

    
    <h2>Move your mouse over this heading</h2>

</body>
</html>

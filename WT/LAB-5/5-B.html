<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>COVID-19 Vaccine Registration Form</h1>
    <form>
        FullName : <input type="text" ><br><br>
        Last Name : <input type="text" ><br><br>
        Aadhar Number : <input type="number" pattern="[0-9] {10}" ><br><br>


        Vaccine Name :
        <select>
            <option> please select  Vaccine Name</option>
            <option>BCA</option>
            <option>MCA</option>
            <option>BSC.IT</option>
            <option>BBA</option>
        </select>
        <br><br>

        Vaccination Center Name : 
        <select>
            <option> please select Vaccination center Name</option>
            <option>2020</option>
            <option>2021</option>
            <option>2022</option>
            <option>2023</option>
        </select>
        <br><br>

         Date of Birth: <input type="date" ><br><br>
         Dose Number: <input type="" ><br><br>

        <tr>
            <td><input  type="reset" value ="CLICK HERE" ></td>
            <td><input type="reset" value="cancel"></td>
        </tr>
    </form>
</body>
</html>

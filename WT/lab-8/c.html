<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Website Layout</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: white;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 35px auto;
        }

        header {
            height: 45px;
            background-color: #c9232b;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 3px;
        }

        .main {
            display: grid;
            grid-template-columns: 20% 1fr 20%;
            min-height: 170px;
            gap: 6px;
        }

        nav {
            background-color: #30358f;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .content {
            background-color: #fff01a;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        aside {
            background-color: #00733f;
            color: white;
            height: 115px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        footer {
            height: 45px;
            background-color: #2ca5d5;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
            }

            .main {
                grid-template-columns: 25% 1fr;
            }

            aside {
                display: none;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            Header
        </header>

        <div class="main">

            <nav>
                Navigation
            </nav>

            <main class="content">
                Content
            </main>

            <aside>
                Sidebar
            </aside>

        </div>

        <footer>
            Footer
        </footer>

    </div>

</body>
</html>

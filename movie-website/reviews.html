        <section id="submit-review">
            <h2>Submit Your Review</h2>
            <form action="#" method="post">
            <table>
                
                <tr>
                    <td><label for="movie-title">Movie Title:</label></td>
                    <td><input type="text" id="movie-title" name="movie-title" required></td>
                </tr>
                <tr>
                    <td><label for="reviewer-name">Your Name:</label></td>
                    <td><input type="text" id="reviewer-name" name="reviewer-name" required></td>
                </tr>
                <tr>
                    <td><label for="rating">Rating:</label></td>
                    <td>
                    <select id="rating" name="rating" required>
                        <option value="5">★★★★★</option>
                        <option value="4">★★★★☆</option>
                        <option value="3">★★★☆☆</option>
                        <option value="2">★★☆☆☆</option>
                        <option value="1">★☆☆☆☆</option>
                    </select>
                    </td>
                </tr>
                <tr>
                    <td><label for="review-text">Your Review:</label></td>
                    <td><textarea id="review-text" name="review-text" rows="4" required></textarea></td>
                </tr>
                <tr>
                    <td></td>
                    <td><button type="submit">Submit Review</button></td>
                </tr>
                
            </table>
            </form>
        </section>
